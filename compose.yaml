services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - airport_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/airport/', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  airport_data:
